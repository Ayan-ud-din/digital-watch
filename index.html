<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital watch</title>


    <style>
       body {
            
            background-color: rgb(105, 75, 172) !important;
           display: flex;
            justify-content: center;
            align-items: center;
        color: #ffffff;        }

        .container{
        
            width: 50%;
            margin-top:90px ;
           height: 50vh;
            display: flex;
            justify-content: center;
            align-items: center;
           



background: rgba(8, 8, 8, 0.29);
border-radius: 16px;
box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
backdrop-filter: blur(5.4px);
-webkit-backdrop-filter: blur(5.4px);
        }

         .container div{
            font-size:80px;
            font-family: Arial, Helvetica, sans-serif;
       
         }

         @media (max-width:334px) {
.container{
            padding: 0%;
            /* margin:0% ; */
         }
         .container div {
            font-size: 40px;
         }
        }
    </style>
</head>

<body>

  

        <div class="container">

            <div id="hrs">00</div>
            <span style="font-size: 40px;padding-left: 20px">:</span>
            <div id="mints">00 </div>
            <span style="font-size: 40px; padding-left: 20px;">:</span>
            <div id="sec">00</div>
        </div>

    

    <script src="app.js"></script>
</body>

</html>
